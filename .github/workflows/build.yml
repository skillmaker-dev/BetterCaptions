name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts in to contents: write.
permissions:
  contents: read

# Cancel redundant runs for the same ref (PRs and repeated pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained single-file publish so users need no .NET runtime.
      # Trimming is intentionally NOT enabled: it is unsupported for WPF.
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/CsOverlay/CsOverlay.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CsOverlay-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/CsOverlay.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "artifacts/CsOverlay-win-x64/CsOverlay.exe" "release/CsOverlay-win-x64.exe"
          Copy-Item "artifacts/CsOverlay-win-arm64/CsOverlay.exe" "release/CsOverlay-win-arm64.exe"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          release/CsOverlay-win-x64.exe
          release/CsOverlay-win-arm64.exe
          --title "${{ github.ref_name }}"
          --generate-notes
          -R "${{ github.repository }}"
