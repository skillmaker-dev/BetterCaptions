name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts in to contents: write.
permissions:
  contents: read

# Cancel redundant runs for the same ref (PRs and repeated pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   self_contained: true,  label: win-x64 }
          - { rid: win-x64,   self_contained: false, label: win-x64-requires-dotnet }
          - { rid: win-arm64, self_contained: true,  label: win-arm64 }
          - { rid: win-arm64, self_contained: false, label: win-arm64-requires-dotnet }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Single-file publish. self_contained=true bundles the .NET runtime so
      # users need nothing installed; false keeps the exe small for users who
      # already have the .NET 10 desktop runtime.
      # Trimming is intentionally NOT enabled: it is unsupported for WPF.
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/BetterCaptions/BetterCaptions.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=${{ matrix.self_contained }}
          -p:DebugType=none
          -o publish/${{ matrix.label }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCaptions-${{ matrix.label }}
          path: publish/${{ matrix.label }}/BetterCaptions.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "artifacts/BetterCaptions-win-x64/BetterCaptions.exe" "release/BetterCaptions-win-x64.exe"
          Copy-Item "artifacts/BetterCaptions-win-arm64/BetterCaptions.exe" "release/BetterCaptions-win-arm64.exe"
          Copy-Item "artifacts/BetterCaptions-win-x64-requires-dotnet/BetterCaptions.exe" "release/BetterCaptions-win-x64-requires-dotnet.exe"
          Copy-Item "artifacts/BetterCaptions-win-arm64-requires-dotnet/BetterCaptions.exe" "release/BetterCaptions-win-arm64-requires-dotnet.exe"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          release/BetterCaptions-win-x64.exe
          release/BetterCaptions-win-arm64.exe
          release/BetterCaptions-win-x64-requires-dotnet.exe
          release/BetterCaptions-win-arm64-requires-dotnet.exe
          --title "${{ github.ref_name }}"
          --generate-notes
          -R "${{ github.repository }}"
